services:
  - type: web
    name: phu-portfolio-static
    runtime: static
    buildCommand: npm ci && npm run verify
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      # Existing services retain omitted rules: remove the old /* Cache-Control
      # no-cache rule in the Render Dashboard when migrating these settings.
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      # Page routes revalidate; asset rules below do not overlap these paths.
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /work
        name: Cache-Control
        value: no-cache
      - path: /work/*
        name: Cache-Control
        value: no-cache
      - path: /about
        name: Cache-Control
        value: no-cache
      - path: /explainable/
        name: Cache-Control
        value: no-cache
      - path: /**/*.html
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /404.html
        name: Cache-Control
        value: no-cache
      # Only generated, content-hashed assets are immutable.
      - path: /assets/site-*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/fonts/*
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
      - path: /assets/*.webp
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
      - path: /assets/fonts.css
        name: Cache-Control
        value: no-cache
      - path: /explainable/assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: redirect
        source: /explainable
        destination: /explainable/
      - type: redirect
        source: /apps/explainable-trust
        destination: /explainable/
      - type: redirect
        source: /apps/explainable-trust/*
        destination: /explainable/
      - type: redirect
        source: /apps/explainable-trust_old
        destination: /explainable/
      # No global SPA rewrite: portfolio routes and missing assets retain 404s.
